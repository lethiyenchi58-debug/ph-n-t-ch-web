<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đang mở n8n… – Tiệm bánh Mitu</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: system-ui, "Segoe UI", sans-serif; background: #fff8f3; color: #4a3428; }
  .hop { text-align: center; max-width: 440px; padding: 24px; }
  .vong { width: 48px; height: 48px; margin: 0 auto 20px; border-radius: 50%;
          border: 5px solid #f3d9c8; border-top-color: #d2691e; animation: quay 1s linear infinite; }
  @keyframes quay { to { transform: rotate(360deg); } }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 6px 0; color: #7a5c4a; line-height: 1.5; }
  .gio { font-variant-numeric: tabular-nums; font-weight: 600; color: #d2691e; }
  .canh { display: none; margin-top: 16px; padding: 12px; background: #fde8e0; border-radius: 8px; color: #8b2e16; }
</style>
</head>
<body>
<div class="hop">
  <div class="vong"></div>
  <h1>Đang khởi động n8n…</h1>
  <p>Trang sẽ tự chuyển sang n8n khi sẵn sàng.</p>
  <p>Đã chờ: <span class="gio" id="gio">0 giây</span></p>
  <p>Thường mất 30 giây – 2 phút (lần đầu có thể 5–15 phút).</p>
  <div class="canh" id="canh">
    Chờ lâu quá? Mở cửa sổ <b>"Mitu n8n - DUNG TAT CUA SO NAY"</b> dưới taskbar để xem lỗi.
  </div>
</div>
<script>
  const N8N = "http://localhost:5678";
  const batDau = Date.now();
  setInterval(() => {
    const s = Math.round((Date.now() - batDau) / 1000);
    document.getElementById("gio").textContent = s < 60 ? s + " giây" : Math.floor(s / 60) + " phút " + (s % 60) + " giây";
    if (s > 600) document.getElementById("canh").style.display = "block";
  }, 1000);

  // /healthz trả lời trước khi giao diện n8n gắn xong (lúc đó "/" báo "Cannot GET /").
  // Nên chờ tới khi tải được favicon của giao diện: ảnh chỉ tải được khi giao diện đã sẵn sàng.
  function kiemTra() {
    const anh = new Image();
    anh.onload = () => location.replace(N8N);
    anh.onerror = () => setTimeout(kiemTra, 2000);
    anh.src = N8N + "/favicon.ico?t=" + Date.now();
  }
  kiemTra();
</script>
</body>
</html>
